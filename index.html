<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>排球戰術板｜Volleyball Tactics Board</title>
<style>
:root{--bg:#0f172a;--panel:#111c33;--panel2:#18264a;--line:#2a3a5c;--text:#e6edf7;--muted:#93a4c3;--accent:#f97316}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 16px 4px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.wrap{max-width:1200px;margin:0 auto;padding:12px 16px 24px;display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
@media(max-width:880px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.sec{margin-bottom:14px}
.sec h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.row{display:flex;flex-wrap:wrap;gap:6px}
button,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:14px}
button:hover:not(:disabled){border-color:#5a73a6}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled,select:disabled{opacity:.4;cursor:not-allowed}
.tabs button{flex:1;padding:9px 4px;font-size:13px}
.advq{margin-bottom:9px}.advt{font-size:12px;color:var(--muted);margin-bottom:4px}
.advq button{font-size:12px;padding:6px 9px}
.rec{background:#111c33;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.rech{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rk{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.who{font-size:12px;font-weight:700}.recplay{margin-left:auto;font-size:12px;padding:4px 9px;background:#22c55e;border-color:#22c55e;color:#052e14;font-weight:700}
.bar{position:relative;height:8px;background:#0b1426;border-radius:4px;margin:7px 30px 4px 0}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}.bar span{position:absolute;right:-30px;top:-5px;font-size:12px;font-weight:700}
.rec ul{margin:4px 0 0;padding-left:2px;list-style:none;font-size:12.5px;line-height:1.6}
.rot button{width:42px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid2 button{text-align:left;font-size:13px;line-height:1.3}
.grid2 small{display:block;color:var(--muted);font-size:11px}
.grid2 button.on small{color:#ffe7d6}
.actions{display:flex;gap:6px}
.btn-play{flex:1;padding:10px;font-size:15px;font-weight:700;background:#22c55e;border-color:#22c55e;color:#052e14}
.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12px;text-align:center}
.lineup div{background:#0b1426;border:1px solid var(--line);border-radius:6px;padding:5px 2px}
.lineup b{display:block;font-size:13px}
.lineup .z{color:var(--muted);font-size:10px}
.lineup .netbar{grid-column:1/4;height:4px;padding:0;border:0;background:#e2e8f0;border-radius:2px;margin-bottom:2px}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.court-col{display:flex;flex-direction:column;gap:12px}
.court-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.viewbar{width:100%;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.seg button{padding:7px 14px}
#camBtns button{font-size:13px;padding:6px 10px}
#view3d{position:relative;width:100%}
#cv3d{width:100%;display:block;border-radius:10px;touch-action:none;cursor:grab}
#cv3d:active{cursor:grabbing}
#skillBar{width:100%;padding:4px 2px 18px}
.skrow{display:flex;align-items:center;gap:8px}
#skSlider{flex:1;accent-color:#f97316}
#skTime{font-size:12px;color:var(--muted);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
#skPlay{min-width:84px}
#skTicks{position:relative;height:30px;margin:2px 0 0 92px;margin-right:150px}
#skTicks span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:#cbd5e1;white-space:nowrap;top:4px}
#skTicks span:nth-child(even){top:17px}
#skTicks i{position:absolute;left:50%;top:-6px;width:1px;height:6px;background:#f97316}
@media(max-width:600px){#skTicks{margin-right:8px;margin-left:8px}.skrow{flex-wrap:wrap}}
.hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:#cbd5e1;background:rgba(15,23,42,.65);padding:3px 8px;border-radius:6px;pointer-events:none}
#court{width:100%;max-width:520px;height:auto;max-height:86vh;display:block}
.info h2{font-size:17px;margin:0}
.info .en{color:var(--muted);font-size:12px;margin-top:2px}
.info p{font-size:14px;line-height:1.65;margin:8px 0}
.info .key{background:#0b1426;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6}
.step{background:#0b1426;border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;font-size:14px;line-height:1.55;min-height:40px;margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:4px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.stat{font-size:12px;color:var(--muted);margin-top:8px}
label.chk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>🏐 排球戰術板 <span style="font-weight:400;font-size:15px;color:var(--muted)">Volleyball Tactics Board</span></h1>
  <div class="sub">以強隊最常用的 5-1 陣型為例，用 2D 戰術板和 3D 模擬，視覺化六個輪次的接發球站位、進攻戰術與防守站位。</div>
</header>

<div class="wrap">
  <!-- 控制面板 -->
  <div class="panel">
    <div class="sec">
      <h3>模式 MODE</h3>
      <div class="row tabs" id="modeTabs">
        <button data-mode="receive">接發球</button>
        <button data-mode="offense">進攻戰術</button>
        <button data-mode="defense">防守站位</button>
        <button data-mode="advice">舉球建議</button>
        <button data-mode="skill">技術分解</button>
      </div>
    </div>

    <div class="sec">
      <h3>輪次 ROTATION（舉球員所在號位）</h3>
      <div class="row rot" id="rotBtns"></div>
      <div class="row" style="margin-top:6px">
        <button id="btnRotate" style="flex:1">↻ 輪轉到下一輪</button>
      </div>
    </div>

    <div class="sec">
      <h3>本輪站位 LINEUP</h3>
      <div class="lineup" id="lineup"></div>
      <div class="note" id="liberoNote"></div>
    </div>

    <div class="sec" id="skillSec" style="display:none">
      <h3>選擇技術 TECHNIQUE</h3>
      <div class="grid2" id="skillBtns">
        <button data-sk="approach4">主攻四步助跑<small>4-Step Approach</small></button>
        <button data-sk="approach3">三步助跑<small>3-Step Approach</small></button>
        <button data-sk="quick">攔中 A 快時機<small>Quick Timing</small></button>
        <button data-sk="block">攔網步法與手型<small>Block Footwork &amp; Hands</small></button>
      </div>
    </div>

    <div class="sec" id="adviceSec" style="display:none">
      <h3>現場狀況 SITUATION</h3>
      <div id="adviceForm"></div>
    </div>

    <div class="sec" id="playSec">
      <h3 id="playTitle">選擇戰術</h3>
      <div class="grid2" id="playBtns"></div>
    </div>

    <div class="sec">
      <div class="actions">
        <button class="btn-play" id="btnPlay">▶ 播放</button>
        <button id="btnReset">↺ 重置</button>
        <select id="speed" title="播放速度">
          <option value="0.6">慢速</option>
          <option value="1" selected>正常</option>
          <option value="1.6">快速</option>
        </select>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="chk"><input type="checkbox" id="chkZones" checked> 顯示號位編號</label>
      </div>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:#facc15"></i>S 舉球員</span>
      <span><i class="dot" style="background:#3b82f6"></i>OH 主攻</span>
      <span><i class="dot" style="background:#22c55e"></i>MB 攔中</span>
      <span><i class="dot" style="background:#a855f7"></i>OP 副攻</span>
      <span><i class="dot" style="background:#f97316"></i>L 自由球員</span>
      <span><i class="dot" style="background:#ef4444"></i>對方球員</span>
    </div>
  </div>

  <!-- 球場與說明 -->
  <div class="court-col">
    <div class="court-box">
      <div class="viewbar">
        <div class="row seg" id="viewTabs">
          <button data-view="2d" class="on">2D 戰術板</button>
          <button data-view="3d">3D 模擬</button>
        </div>
        <div class="row" id="camBtns" style="display:none">
          <button data-cam="us">我方視角</button>
          <button data-cam="side">側面</button>
          <button data-cam="opp">對方視角</button>
          <button data-cam="top">俯視</button>
          <button data-cam="close" style="display:none">特寫</button>
        </div>
      </div>
      <svg id="court" viewBox="-1.8 -11 12.6 21.6" aria-label="排球場"></svg>
      <div id="view3d" style="display:none">
        <canvas id="cv3d" aria-label="3D 排球場"></canvas>
        <div class="hint">拖曳旋轉・滾輪縮放</div>
      </div>
      <div id="skillBar" style="display:none">
        <div class="skrow">
          <button id="skPlay">▶ 播放</button>
          <input type="range" id="skSlider" min="0" max="1000" value="0">
          <span id="skTime">0.00 秒</span>
          <select id="skSpeed"><option value="0.25">0.25x</option><option value="0.5" selected>0.5x 慢動作</option><option value="1">1x 實際速度</option></select>
        </div>
        <div id="skTicks"></div>
      </div>
    </div>
    <div class="panel info" id="info">
      <h2 id="infoTitle"></h2>
      <div class="en" id="infoEn"></div>
      <p id="infoDesc"></p>
      <div class="key" id="infoKey"></div>
      <div class="step" id="step">按「▶ 播放」開始動畫。</div>
      <div class="stat" id="stat"></div>
    </div>
  </div>
</div>
<footer>說明：本工具為教學用的簡化示意，站位座標參考常見的 5-1 系統，實際站位會依球隊與教練而不同。</footer>

<script>
/* ========== 基本資料 ========== */
const ROLE={
  S:{name:'舉球員',short:'S',color:'#facc15',txt:'#1f1600'},
  OH1:{name:'主攻 1',short:'OH1',color:'#3b82f6',txt:'#fff'},
  OH2:{name:'主攻 2',short:'OH2',color:'#3b82f6',txt:'#fff'},
  MB1:{name:'攔中 1',short:'MB1',color:'#22c55e',txt:'#052e14'},
  MB2:{name:'攔中 2',short:'MB2',color:'#22c55e',txt:'#052e14'},
  OPP:{name:'副攻',short:'OP',color:'#a855f7',txt:'#fff'},
  L:{name:'自由球員',short:'L',color:'#f97316',txt:'#fff'}
};
const IDS=['S','OH1','OH2','MB1','MB2','OPP','L'];
const OPPS=['o1','o2','o3','o4','o5','o6'];
const SEQ=[1,6,5,4,3,2];                       // 輪轉方向：2→1→6→5→4→3
const BASE=['S','MB2','OH2','OPP','MB1','OH1']; // 第 1 輪（舉球員在 1 號位）
const TARGET={x:6.0,y:0.8};                     // 舉球目標點（二、三號位之間）
const BENCH={x:-1.15,y:7.2};

function zonesFor(r){const z={};for(let i=0;i<6;i++){z[BASE[((i-(r-1))%6+6)%6]]=SEQ[i];}return z;}
const isFront=z=>z===2||z===3||z===4;
function lineup(r){
  const z=zonesFor(r),f=id=>isFront(z[id]);
  const frontOH=f('OH1')?'OH1':'OH2',backOH=frontOH==='OH1'?'OH2':'OH1';
  const frontMB=f('MB1')?'MB1':'MB2',backMB=frontMB==='MB1'?'MB2':'MB1';
  return {z,frontOH,backOH,frontMB,backMB,sFront:f('S'),oppFront:f('OPP')};
}

/* 接發球站位（x：0~9 由左到右；y：離網距離 0~9） */
const RECEIVE={
 1:{S:[8.3,7.6],L:[4.5,6.8],OH2:[1.8,6.5],OPP:[1.0,1.4],MB1:[4.5,1.0],OH1:[7.2,6.0]},
 2:{S:[5.7,4.0],L:[4.3,6.6],OH2:[1.6,5.8],OPP:[5.0,1.4],MB1:[8.2,1.0],OH1:[7.3,6.6]},
 3:{MB2:[0.8,0.8],S:[1.3,2.2],OH2:[2.2,5.6],OH1:[4.8,6.6],L:[7.4,6.6],OPP:[8.3,1.2]},
 4:{S:[1.0,0.8],MB2:[3.4,0.9],OH2:[7.2,5.6],OPP:[8.4,7.8],OH1:[1.8,6.6],L:[4.5,6.8]},
 5:{S:[4.5,0.8],MB2:[8.0,0.9],OH1:[1.6,5.6],L:[4.3,6.6],OPP:[5.6,8.0],OH2:[7.3,6.6]},
 6:{S:[8.0,0.8],MB1:[1.0,0.9],OH1:[2.0,5.6],OH2:[4.5,6.6],L:[7.3,6.6],OPP:[0.8,7.8]}
};

/* 進攻戰術 */
const TEMPO={quick:{dur:450,arc:0.35},fast:{dur:650,arc:0.6},high:{dur:1300,arc:2.2},back:{dur:750,arc:0.8}};
const PLAYS=[
 {id:'high4',name:'四號位高球',en:'High Ball to Zone 4',who:'frontOH',tempo:'high',block:'double',
  contact:()=>[0.6,0.6],land:()=>[6.8,-6.0],
  desc:'舉球員把球高高舉到四號位標誌桿附近，主攻有充足時間調整助跑和起跳，是最穩定的「保底球」。',
  key:'使用時機：一傳不到位、關鍵分需要穩定得分時。<br>缺點：球在空中時間長，對方有時間組成完整的雙人攔網。'},
 {id:'go4',name:'四號位平快',en:'Go / Shoot Set',who:'frontOH',tempo:'fast',block:'late',
  contact:()=>[0.8,0.6],land:()=>[0.9,-7.6],
  desc:'球速快、弧度低，直接平拉到四號位。是現代強隊主攻最主要的攻擊方式。',
  key:'目的：讓對方攔中來不及移動到邊線，攔網只剩一個半人，主攻更容易打直線或斜線。'},
 {id:'aquick',name:'A 快（近體快）',en:'Quick 1 / A',who:'frontMB',tempo:'quick',block:'solo',
  contact:()=>[5.2,0.5],land:()=>[3.6,-4.2],
  desc:'攔中在舉球員正前方起跳，舉球員把球直接「送」到攔中手上，是速度最快的進攻。',
  key:'目的：牽制對方攔中。只要 A 快有威脅，對方攔中就不敢提早往兩邊移動，邊線攻擊手會更輕鬆。'},
 {id:'cquick',name:'背快（C 快）',en:'Back Quick / C',who:'frontMB',tempo:'quick',block:'solo',
  contact:()=>[7.3,0.5],land:()=>[7.6,-5.0],
  desc:'攔中跑到舉球員身後起跳，舉球員背傳快球。',
  key:'目的：攻擊對方攔網右側的空檔，和四號位進攻搭配，把對方攔網往兩邊拉開。'},
 {id:'right',name:'二號位攻擊',en:'Opposite Attack',who:'OPP',tempo:'fast',block:'late',
  contact:lu=>lu.oppFront?[8.4,0.6]:[7.8,3.6],land:()=>[1.8,-6.5],
  desc:'',key:''},
 {id:'pipe',name:'後排攻擊（Pipe）',en:'Pipe / Back-row Attack',who:'backOH',tempo:'back',block:'fooled',
  contact:()=>[4.5,3.6],land:()=>[5.0,-7.8],
  desc:'後排主攻從三米線後的中間起跳攻擊，通常和攔中快攻同時出現。',
  key:'目的：對方攔中被 A 快吸引起跳後，中間後方就空了。強隊靠它形成「四點同時進攻」。'},
 {id:'timediff',name:'時間差（攔中掩護）',en:'Tandem / Time Difference',who:'frontOH',tempo:'fast',block:'fooled',
  contact:()=>[4.0,0.6],land:()=>[2.0,-5.5],
  desc:'攔中先跑 A 快並起跳當誘餌，主攻晚半拍在攔中旁邊起跳扣球。',
  key:'目的：對方攔網手跟著攔中跳起後還沒落地，主攻就打在攔網落地的空檔上。'}
];
function playText(p,lu){
  if(p.id!=='right')return p;
  return lu.oppFront
   ?{...p,name:'二號位攻擊（副攻）',en:'Opposite / Red',desc:'副攻在前排二號位攻擊，是許多強隊的主要得分點。舉球員背傳或平傳到右側標誌桿附近。',key:'目的：和四號位、攔中形成左、中、右三點進攻，讓對方攔網無法集中。'}
   :{...p,name:'後排二號位（D 球）',en:'D Ball / Back-row Right',desc:'副攻在後排時，從三米線後的二號位起跳攻擊。',key:'目的：舉球員在前排的輪次，前排只剩兩個攻擊手。靠 D 球補上第三個攻擊點。'};
}

/* 防守 */
const DEF=[
 {id:'opp4',name:'對方四號位強攻',en:'vs. Outside Hitter',atk:'o4',contact:[8.3,-0.6],tempo:800,
  slots:{RF:[8.1,0.35],MB:[7.3,0.35],LF:[1.8,3.0],BR:[8.3,6.0],BL:[1.2,6.4],BM:[5.3,8.4]},
  blockers:['RF','MB'],shots:[[8.3,6.0],[6.2,2.4]],main:'BL',
  desc:'對方主攻從他們的四號位進攻，在我方看來是右側。我方二號位與攔中組成雙人攔網，主要封住斜線。',
  key:'站位重點：四號位後撤防吊球；後排三人採邊線防守（Perimeter），分別守直線、大斜線和底線深區。'},
 {id:'opp2',name:'對方二號位攻擊',en:'vs. Opposite Hitter',atk:'o2',contact:[0.7,-0.6],tempo:750,
  slots:{LF:[0.9,0.35],MB:[1.7,0.35],RF:[7.2,3.0],BL:[0.7,6.0],BR:[7.8,6.4],BM:[3.7,8.4]},
  blockers:['LF','MB'],shots:[[0.7,6.0],[2.8,2.4]],main:'BR',
  desc:'對方副攻從他們的二號位進攻，在我方看來是左側。我方四號位與攔中雙人攔網。',
  key:'站位重點：二號位後撤防吊球；一號位守大斜線，五號位守直線，六號位守深區。'},
 {id:'opp3',name:'對方攔中快攻',en:'vs. Quick Attack',atk:'o3',contact:[3.8,-0.5],tempo:450,
  slots:{MB:[3.8,0.35],LF:[2.4,0.9],RF:[6.6,1.2],BL:[1.6,5.0],BR:[7.2,5.0],BM:[4.2,7.4]},
  blockers:['MB'],shots:[[7.2,5.0],[4.2,7.4],[5.0,2.0]],main:'BL',
  desc:'快攻速度太快，通常只有我方攔中來得及攔網，形成單人攔網。',
  key:'站位重點：兩邊攔網手往中間收，隨時補位；後排往前收縮，防守快攻打出的短角度球。'},
 {id:'pipe',name:'對方後排攻擊',en:'vs. Pipe',atk:'o6',contact:[4.6,-3.6],tempo:750,
  slots:{MB:[4.2,0.35],RF:[5.0,0.35],LF:[1.8,2.6],BL:[1.3,6.0],BR:[7.7,6.0],BM:[4.6,8.6]},

/* ========== 動畫 ========== */
let runId=0,speed=1;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function tween(dur,fn,run){
  return new Promise(res=>{const t0=performance.now();
    function f(now){if(run!==runId){res();return;}
      const t=Math.min(1,(now-t0)/(dur/speed));fn(ease(t),t);
      if(t<1)requestAnimationFrame(f);else res();}
    requestAnimationFrame(f);});
}
function moveAll(targets,dur,run){
  const from={};for(const id in targets)from[id]={...POS[id]};
  return tween(dur,e=>{for(const id in targets){const a=from[id],b=targets[id];
    POS[id].x=a.x+(b.x-a.x)*e;POS[id].y=a.y+(b.y-a.y)*e;if(b.o!==undefined)POS[id].o=a.o+(b.o-a.o)*e;}renderAll();},run);
}
/* 3D 用的資料：球的軌跡、攔網陰影、攻擊路線、特效 */
const TRAILS=[],ARROWS3D=[],BURSTS=[];let SHADOW3D=null,HL=[];
const ARC3D=1.6; // 2D 弧度 → 3D 高度（公尺）
// h0、h1：球在起點、終點的高度（公尺）
function moveBall(a,b,dur,arc,run,h0=1,h1=1){
  el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#fff','stroke-width':0.05,'stroke-dasharray':'0.18 0.14',opacity:0.65},gTrail);
  const hAt=t=>h0+(h1-h0)*t+Math.sin(Math.PI*t)*arc*ARC3D;
  const pts=[];for(let i=0;i<=24;i++){const t=i/24;pts.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,h:hAt(t)});}
  TRAILS.push(pts);
  BALL.vis=1;
  return tween(dur,(e,t)=>{BALL.x=a.x+(b.x-a.x)*t;BALL.y=a.y+(b.y-a.y)*t;BALL.h=Math.sin(Math.PI*t)*arc;BALL.z=hAt(t);renderBall();},run);
}
const wait=(ms,run)=>tween(ms,()=>{},run);
// 起跳到指定高度（z），或落地（z=0）
function setZ(ids,z,dur,run,delay=0){
  return wait(delay,run).then(()=>{const from={};ids.forEach(id=>from[id]=POS[id].z||0);
    return tween(dur,e=>{ids.forEach(id=>POS[id].z=from[id]+(z-from[id])*e);},run);});
}
// 原地跳一下（誘餌、被騙起跳的攔網）
function hop(ids,dur,run,delay=0){
  return wait(delay,run).then(()=>tween(dur,(e,t)=>{ids.forEach(id=>{POS[id].z=Math.sin(Math.PI*t)*0.8;if(POS[id].act==='spike')POS[id].ap=t;});},run));
}
// 扣球揮臂進度（0 後擺 → 0.6 拉弓 → 0.78 擊球 → 1 收臂）
function animAP(id,a,b,dur,run,delay=0){
  return wait(delay,run).then(()=>{if(run!==runId)return;POS[id].act='spike';return tween(dur,e=>{POS[id].ap=a+(b-a)*e;},run);});
}

  const run=runId;tween(900,(e)=>{c.setAttribute('r',0.2+e*1.1);c.setAttribute('opacity',1-e);},run);
}

function defBaseTargets(lu){

  for(const k in R)t[R[k]]={...pt(DEF_BASE[k]),o:1};

}
const OPP_RECEIVE={o1:[1.5,-9.8],o2:[1.5,-1.2],o3:[4.5,-1.2],o4:[7.5,-1.2],o5:[7.5,-6.5],o6:[4.5,-7.5]};
const OPP_DEF={o1:[3.0,-0.9],o2:[1.2,-1.6],o3:[4.5,-1.4],o4:[7.8,-1.6],o5:[6.8,-7.0],o6:[4.5,-6.8]};
function oppTargets(map){const t={};for(const k in map)t[k]={...pt(map[k]),o:1};return t;}

function placeInstant(t){for(const id in t){POS[id]={x:t[id].x,y:t[id].y,o:t[id].o??1,z:0};}renderAll();}

function setupMode(animate=true){
  runId++;busy=false;clearFx();

/* ========== 進攻流程 ========== */
function attackerOf(p,lu){return p.who==='OPP'?'OPP':lu[p.who];}
function approachTargets(lu){
  const t={};
  t[lu.frontOH]=pt([0.3,3.4]);t[lu.frontMB]=pt([4.6,2.4]);
  t.OPP=lu.oppFront?pt([8.8,3.4]):pt([8.0,6.2]);
  t[lu.backOH]=pt([4.0,6.6]);t.L=pt([2.4,6.4]);
  return t;
}
function contactMap(p,lu){
  const m={[lu.frontOH]:[0.8,0.6],[lu.frontMB]:[5.2,0.5],OPP:lu.oppFront?[8.4,0.6]:[7.8,3.6],[lu.backOH]:[4.5,3.6],L:[3.0,5.6]};
  m[attackerOf(p,lu)]=p.contact(lu);
  if(p.id==='cquick'&&lu.oppFront)m.OPP=[8.6,1.2];
  return m;
}
function blockTargets(p,ax,mbDecoyX){
  const side=ax<4.5?1:-1,pin=ax<4.5?'o2':'o4',pinBase=ax<4.5?1.5:7.5,Y=-0.35,t={};
  const pinX=clampX(ax-0.4*side),mbX=clampX(ax+0.45*side);
  if(p.block==='double'){t[pin]={x:pinX,y:Y};t.o3={x:mbX,y:Y};}
  else if(p.block==='late'){t[pin]={x:pinX,y:Y};t.o3={x:4.5+(mbX-4.5)*0.55,y:-0.7};}
  else if(p.block==='solo'){t.o3={x:ax,y:Y};}
  else if(p.block==='fooled'){t.o3={x:mbDecoyX,y:Y};t[pin]={x:pinBase+(pinX-pinBase)*0.5,y:-0.6};}
  return t;
}
function coverTargets(atk,c,lu){
  const dy=Math.min(8.4,Math.max(6.8,c.y+3.6));
  const slots=[[c.x-1.6,c.y+1.5],[c.x,c.y+2.1],[c.x+1.6,c.y+1.5],[2.4,dy],[6.6,dy]].map(s=>({x:clampX(s[0]),y:Math.min(8.6,s[1])}));
  const others=IDS.filter(id=>id!==atk&&id!==lu.backMB).sort((a,b)=>Math.hypot(POS[a].x-c.x,POS[a].y-c.y)-Math.hypot(POS[b].x-c.x,POS[b].y-c.y));
  const t={},used=new Set();
  others.forEach(id=>{let best=-1,bd=1e9;slots.forEach((s,i)=>{if(used.has(i))return;const d=Math.hypot(s.x-POS[id].x,s.y-POS[id].y);if(d<bd){bd=d;best=i;}});used.add(best);t[id]=slots[best];});
  return t;
}

async function runServeReceive(withAttack){
  const lu=lineup(rot);setupMode(false);const run=runId;busy=true;updateUI();
  const p=playText(PLAYS.find(x=>x.id===playId),lu);
  const atk=attackerOf(p,lu);
  if(withAttack)highlight([atk]);else highlight([lu.frontOH,lu.backOH,'L']);
  const step=s=>{if(run===runId)$('step').innerHTML=s;};

  step('① 對方發球，由自由球員接發。舉球員同時'+(lu.sFront?'沿著網':'從後排「插上」')+'跑到二、三號位之間準備舉球。');
  BALL.x=1.5;BALL.y=-9.8;
  POS.S.act='set';
  await Promise.all([moveBall(pt(OPP_RECEIVE.o1),at('L'),1300,1.4,run,2.9,0.8),moveAll({S:TARGET},1300,run),moveAll({o1:{x:1.5,y:-6.5}},1300,run)]);
  if(run!==runId)return;

  step(withAttack?'② 一傳到位，所有攻擊手退到助跑起點，準備同時進攻。':'② 一傳到位，各攻擊手退到助跑起點準備進攻。');
  [lu.frontOH,lu.backOH].forEach(id=>delete POS[id].act);
  wait(500,run).then(()=>delete POS.L.act);
  await Promise.all([moveBall(at('L'),TARGET,1000,1.3,run,0.8,2.5),moveAll(approachTargets(lu),1000,run)]);
  if(run!==runId)return;

  if(!withAttack){
    step('✔ 接發球完成！切換到「進攻戰術」就能看接下來怎麼進攻。');
    busy=false;updateUI();return;
  }

  const cm=contactMap(p,lu),c=pt(cm[atk]),T=TEMPO[p.tempo];
  const mbDecoyX=cm[lu.frontMB][0];
  step(`③ <b>${p.name}</b>：舉球員把球傳給 ${ROLE[atk].name}，其他攻擊手同時助跑當誘餌，讓對方攔網猜不到。`);
  const mine={};for(const id in cm)mine[id]=pt(cm[id]);
  const early={};
  if(p.id==='timediff'){early[lu.frontMB]=mine[lu.frontMB];delete mine[lu.frontMB];}
  const bt=blockTargets(p,c.x,mbDecoyX);
  const btEarly={};if(p.block==='fooled'){btEarly.o3=bt.o3;delete bt.o3;}
  const back=c.y>2, hC=back?3.4:3.1;                       // 擊球點高度
  const jumpers=[atk,...Object.keys(bt).filter(k=>bt[k].y===-0.35)];
  const hops=[];
  if(p.block==='fooled'&&atk!==lu.frontMB)POS[lu.frontMB].act='spike';
  if(p.id==='timediff')hops.push(hop([lu.frontMB],450,run,T.dur*0.3));
  if(p.block==='fooled'){hops.push(hop(['o3'],450,run,T.dur*0.35));if(p.id!=='timediff')hops.push(hop([lu.frontMB],450,run,T.dur*0.3));}
  await Promise.all([
    ...hops,
    setZ(jumpers,0.8,280,run,Math.max(0,T.dur-280)),
    animAP(atk,0,0.6,400,run,Math.max(0,T.dur-400)),
    moveBall(TARGET,c,T.dur,T.arc,run,2.5,hC),
    moveAll(mine,T.dur,run),
    moveAll(early,T.dur*0.5,run),
    moveAll(btEarly,T.dur*0.55,run),
    moveAll(bt,T.dur,run)
  ]);
  if(run!==runId)return;

  const blockNote={double:'對方來得及組成雙人攔網。',late:'對方攔中慢了一步，攔網沒有完全併攏。',solo:'速度太快，對方只來得及單人攔網。',fooled:'對方攔中被誘餌騙起跳，攔網出現空檔。'}[p.block];
  step(`④ 扣球！${blockNote} 其餘球員立刻圍到攻擊手身邊「掩護」，準備接被攔回來的球。`);
  const land=pt(p.land(lu));
  await animAP(atk,0.6,0.78,120,run);            // 揮臂到擊球點
  if(run!==runId)return;
  IDS.forEach(id=>{if(id!==atk)delete POS[id].act;});
  await Promise.all([moveBall(c,land,420,back?0.3:0.15,run,hC,0),animAP(atk,0.78,1,380,run),setZ(jumpers,0,450,run),moveAll(coverTargets(atk,c,lu),700,run)]);
  if(run!==runId)return;
  burst(land,'得分！');
  busy=false;updateUI();
}

async function runDefense(){
  const lu=lineup(rot);setupMode(false);const run=runId;busy=true;updateUI();
  const d=DEF.find(x=>x.id===defId),R=defRoles(lu);
  highlight([d.atk]);
  const step=s=>{if(run===runId)$('step').innerHTML=s;};

  step('① 對方一傳到位，四個攻擊點同時助跑。我方攔網手盯住對方舉球員，後排保持基本防守位置。');
  BALL.x=OPP_DEF.o5[0];BALL.y=OPP_DEF.o5[1];
  await Promise.all([moveBall(pt(OPP_DEF.o5),pt(OPP_DEF.o1),1100,1.3,run,0.8,2.5),
    moveAll({o4:pt([8.8,-3.6]),o3:pt([3.9,-2.4]),o2:pt([0.2,-3.6]),o6:pt([4.6,-6.4])},1100,run)]);
  if(run!==runId)return;

  step(`② 對方舉球給 <b>${d.name.replace('對方','')}</b>，我方立刻移動：攔網手併攏攔網，其他人移到防守位置。`);
  const ours={};for(const k in d.slots)ours[R[k]]=pt(d.slots[k]);
  const opps={o4:pt([8.3,-0.6]),o3:pt([3.8,-0.5]),o2:pt([0.7,-0.6]),o6:pt([4.6,-3.6])};
  opps[d.atk]=pt(d.contact);
  const hA=d.atk==='o6'?3.4:3.1,jumpers=[d.atk,...d.blockers.map(k=>R[k])];
  await Promise.all([moveBall(pt(OPP_DEF.o1),pt(d.contact),d.tempo,d.tempo<500?0.35:0.9,run,2.5,hA),moveAll(ours,d.tempo,run),moveAll(opps,d.tempo,run),
    setZ(jumpers,0.8,280,run,Math.max(0,d.tempo-280)),animAP(d.atk,0,0.6,400,run,Math.max(0,d.tempo-400))]);
  if(run!==runId)return;

  // 攔網陰影與攻擊路線
  const A=pt(d.contact),V={x:A.x,y:A.y-3.5};
  const bx=d.blockers.map(k=>d.slots[k][0]);
  const x1=Math.min(...bx)-0.45,x2=Math.max(...bx)+0.45,y0=0.1;
  const proj=x=>V.x+(x-V.x)*((9-V.y)/(y0-V.y));
  el('polygon',{points:`${x1},${y0} ${x2},${y0} ${proj(x2)},9 ${proj(x1)},9`,fill:'#0f172a',opacity:0.28},gShadow);
  SHADOW3D=clipCourt([[x1,y0],[x2,y0],[proj(x2),9],[proj(x1),9]]);
  const mainT=pt(d.slots[d.main]);

function drawPole(side){
  const x=5.5*side;
  seg3([x,0,0],[x,2.55,0],'#94a3b8',0.1,2);
  seg3([x,2.43,0],[4.75*side,2.43,0],'#cbd5e1',0.015,1);
}
function drawAntenna(side){
  const x=4.5*side;
  for(let i=0;i<18;i++)seg3([x,1.43+i*0.1,0],[x,1.53+i*0.1,0],i%2?'#f8fafc':'#ef4444',0.025,1.5);
}
function drawBall(){
  const c=toCam(wp(BALL.x,BALL.z,BALL.y));if(c[2]<NEAR)return;
  const p=scr(c),r=Math.max(3,0.15*p.s);
  ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#1d4ed8';ctx.lineWidth=Math.max(1,r*0.25);
  ctx.beginPath();ctx.arc(p.x,p.y,r*0.8,-0.6,1.6);ctx.stroke();
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.lineWidth=1;ctx.strokeStyle='#1e3a8a';ctx.stroke();
}
function arrowHead(pa,pb,color,size){
  const a=Math.atan2(pb.y-pa.y,pb.x-pa.x);
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(pb.x,pb.y);
  ctx.lineTo(pb.x-size*Math.cos(a-0.4),pb.y-size*Math.sin(a-0.4));
  ctx.lineTo(pb.x-size*Math.cos(a+0.4),pb.y-size*Math.sin(a+0.4));ctx.closePath();ctx.fill();
}

function draw3D(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e293b');g.addColorStop(1,'#0b1222');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 地板與球場
  poly3([wp(-3.5,0,-12.5),wp(12.5,0,-12.5),wp(12.5,0,12.5),wp(-3.5,0,12.5)],'#1f6f55');
  poly3([wp(0,0,-9),wp(9,0,-9),wp(9,0,9),wp(0,0,9)],'#d88c4f');
  poly3([wp(0,0,-3),wp(9,0,-3),wp(9,0,3),wp(0,0,3)],'#c97a3d');
  [[0,-9,9,-9],[0,9,9,9],[0,-9,0,9],[9,-9,9,9],[0,0,9,0],[0,-3,9,-3],[0,3,9,3]].forEach(([a,b,c,d])=>seg3(wp(a,0.01,b),wp(c,0.01,d),'#fff',0.05,1));
  if($('chkZones').checked){
    ctx.textAlign='center';ctx.textBaseline='middle';
    [[4,1.5,1.5],[3,4.5,1.5],[2,7.5,1.5],[5,1.5,6],[6,4.5,6],[1,7.5,6]].forEach(([n,x,y])=>{
      const c=toCam(wp(x,0,y));if(c[2]<NEAR)return;const p=scr(c);
      ctx.font=`800 ${Math.max(10,1.1*p.s)}px system-ui`;ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillText(n,p.x,p.y);});
  }
  // 地上的圖層：攔網陰影、特效圈、高亮圈、影子
  if(SHADOW3D&&SHADOW3D.length>2)poly3(SHADOW3D.map(q=>wp(q[0],0.015,q[1])),'rgba(15,23,42,0.32)');
  const now=performance.now();
  for(let i=BURSTS.length-1;i>=0;i--){const b=BURSTS[i],t=(now-b.t0)/900;if(t>1){BURSTS.splice(i,1);continue;}
    poly3(circ3(b.x,b.y,0.2+t*1.2),null,`rgba(253,224,71,${1-t})`,3);}
  for(const id in NODE){const p=POS[id];if(p.o<0.1)continue;
    poly3(circ3(p.x,p.y,0.3+(p.z||0)*0.15,14),`rgba(0,0,0,${0.28-(p.z||0)*0.12})`);
    if(HL.includes(id)){ctx.setLineDash([5,4]);poly3(circ3(p.x,p.y,0.6),null,'#ffffff',2);ctx.setLineDash([]);}}
  if(FOOT.length)drawFootprints3D();
  if(BALL.vis)poly3(circ3(BALL.x,BALL.y,0.14,12),'rgba(0,0,0,0.3)');
  // 立體物件：依距離由遠到近排序再畫
  const items=[];
  for(const id in NODE){const p=POS[id];if(p.o<0.1)continue;items.push({d:toCam(wp(p.x,0.9,p.y))[2],f:()=>drawPlayer(id)});}
  for(let i=0;i<19;i++){const x0=-4.75+i*0.5,x1=x0+0.5;items.push({d:toCam([(x0+x1)/2,1.93,0])[2],f:()=>drawNetStrip(x0,x1)});}
  [-1,1].forEach(s=>{items.push({d:toCam([5.5*s,1.3,0])[2],f:()=>drawPole(s)});items.push({d:toCam([4.5*s,2.3,0])[2]-0.01,f:()=>drawAntenna(s)});});
  if(BALL.vis)items.push({d:toCam(wp(BALL.x,BALL.z,BALL.y))[2]-0.05,f:drawBall});
  items.sort((a,b)=>b.d-a.d).forEach(it=>{if(it.d>NEAR)it.f();});
  // 球的飛行軌跡與攻擊路線
  TRAILS.forEach(pts=>{for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];seg3(wp(a.x,a.h,a.y),wp(b.x,b.h,b.y),'rgba(255,255,255,0.55)',0.03,1.2,[4,4]);}});
  ARROWS3D.forEach(ar=>{const col=ar.main?'#ef4444':'rgba(241,245,249,0.85)';
    const r=seg3(wp(ar.a.x,ar.a.h,ar.a.y),wp(ar.b.x,ar.b.h,ar.b.y),col,ar.main?0.07:0.04,ar.main?2.5:1.5,ar.main?null:[6,5]);
    if(r)arrowHead(r[0],r[1],col,ar.main?12:9);});
}
function wrapAngle(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
function setCam(name){
  let p=PRESET[name];CAM.ttx=0;CAM.tty=1.0;CAM.ttz=0;
  if(name==='close'){const c=DEMOS[SK.id].cam;p=[c.th,c.ph,c.r];CAM.ttx=c.x-4.5;CAM.tty=c.h;CAM.ttz=c.y;}
  CAM.tth=CAM.th+wrapAngle(p[0]-CAM.th);CAM.tph=p[1];CAM.tr=p[2];
  document.querySelectorAll('#camBtns button').forEach(b=>b.classList.toggle('on',b.dataset.cam===name));}
function loop3D(){
  skillTick(performance.now());
  if(view==='3d'&&W){
    CAM.th+=(CAM.tth-CAM.th)*0.12;CAM.ph+=(CAM.tph-CAM.ph)*0.12;CAM.r+=(CAM.tr-CAM.r)*0.12;
    CAM.tx+=(CAM.ttx-CAM.tx)*0.12;CAM.ty+=(CAM.tty-CAM.ty)*0.12;CAM.tz+=(CAM.ttz-CAM.tz)*0.12;
    trackMotion(performance.now());setupCam();draw3D();
  }
  requestAnimationFrame(loop3D);
}

const FOOT=[];
function interpK(keys,t){
  if(t<=keys[0][0])return keys[0].slice(1);
  for(let i=0;i<keys.length-1;i++){const a=keys[i],b=keys[i+1];
    if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]||1),e=u*u*(3-2*u);return a.slice(1).map((v,j)=>v+(b[j+1]-v)*e);}}
  return keys[keys.length-1].slice(1);
}
const jumpZ=(D,t,t0=D.takeoff,t1=D.land,H=D.jumpH)=>{if(t<=t0||t>=t1)return 0;const u=(t-t0)/(t1-t0);return 4*H*u*(1-u);};
function footAt(D,f,t){
  let pos=D.start[f];
  for(const s of D.steps){if(s.f!==f)continue;
    if(t>=s.t1){pos=s.to;continue;}
    if(t>s.t0){const u=(t-s.t0)/(s.t1-s.t0),e=u*u*(3-2*u);
      return{x:pos[0]+(s.to[0]-pos[0])*e,y:pos[1]+(s.to[1]-pos[1])*e,h:Math.sin(Math.PI*u)*0.14};}
    break;}
  return{x:pos[0],y:pos[1],h:0};
}
function ikKnee(h,a){
  const L=0.46,d=Math.hypot(a[0]-h[0],a[1]-h[1],a[2]-h[2]),mid=lerp3(h,a,0.5);
  if(d>=2*L-1e-3)return mid;
  const k=Math.sqrt(L*L-(d/2)**2),vf=(a[2]-h[2])/d,vu=(a[1]-h[1])/d;
  return[mid[0],mid[1]+vf*k,mid[2]-vu*k];
}
function armPose(D,t){
  if(D.arms==='block'){const z=jumpZ(D,t);return z>0.02?mixJ(POSES.blockReady,POSES.block,Math.min(1,z/(D.jumpH*0.55))):POSES.blockReady;}
  const T=D.armT,seg=(a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
  const walkArms=walk(STAND,t*Math.PI/0.33,0.8);
  if(t<T.back0)return walkArms;
  if(t<T.back1)return mixJ(walkArms,spikePose(0),seg(T.back0,T.back1));
  if(t<T.up1)return spikePose(0.35*seg(T.back1,T.up1));
  if(t<T.cock)return spikePose(0.35+0.25*seg(T.up1,T.cock));
  if(t<T.hit)return spikePose(0.6+0.18*seg(T.cock,T.hit));
  if(t<T.follow)return spikePose(0.78+0.22*seg(T.hit,T.follow));
  if(t<D.land)return spikePose(1);

function demoJ(D,t,bx,by){
  const pel=interpK(D.pel,t)[0],z=jumpZ(D,t),U=armPose(D,t),J={},dy=pel-U.pel[1];
  UPPER.forEach(k=>J[k]=[U[k][0],U[k][1]+dy,U[k][2]]);
  J.pel=[0,pel,0];J.hipL=[-0.11,pel-0.02,0];J.hipR=[0.11,pel-0.02,0];
  const local=(f,fp)=>[fp.x-bx,0.09+fp.h-z,-(fp.y-by)];
  ['L','R'].forEach(f=>{
    let ank;
    if(t<D.takeoff)ank=local(f,footAt(D,f,t));
    else if(t>=D.land){const lb=interpK(D.body,D.land);ank=local(f,{x:lb[0]+(f==='L'?-0.13:0.13),y:lb[1],h:0});}
    else{const g=local(f,footAt(D,f,D.takeoff)),a=AIR['ank'+f],k=Math.min(1,(t-D.takeoff)/0.12);
      ank=[g[0]+(a[0]-g[0])*k,g[1]+(a[1]-g[1])*k,g[2]+(a[2]-g[2])*k];}
    J['ank'+f]=ank;J['toe'+f]=[ank[0],ank[1]-0.05,ank[2]+0.15];
    J['kne'+f]=ikKnee(J['hip'+f],ank);
  });
  return J;
}
function ballAt(D,t){
  const segs=D.ball;let s=segs[0];
  for(const g of segs){s=g;if(t<=g.t1)break;}
  const u=Math.max(0,Math.min(1,(t-s.t0)/(s.t1-s.t0)));
  return{x:s.a[0]+(s.b[0]-s.a[0])*u,y:s.a[1]+(s.b[1]-s.a[1])*u,h:s.a[2]+(s.b[2]-s.a[2])*u+Math.sin(Math.PI*u)*s.arc};
}
function applySkill(t){
  const D=DEMOS[SK.id],a=D.actor,[bx,by]=interpK(D.body,t);
  Object.assign(POS[a],{x:bx,y:by,z:jumpZ(D,t),o:1});POS[a].J=demoJ(D,t,bx,by);
  const st=D.setter;Object.assign(POS[st.id],{x:st.x,y:st.y,z:0,o:1,act:'set'});
  if(D.opp){const o=D.opp,[ox,oy]=interpK(o.path,t),p=POS[o.id];Object.assign(p,{x:ox,y:oy,o:1,z:jumpZ(null,t,o.takeoff,o.land,0.8)});

  const b=ballAt(D,t);Object.assign(BALL,{x:b.x,y:b.y,z:b.h,h:Math.max(0,b.h-1)/2,vis:1});
  FOOT.forEach(f=>f.on=t>=f.t1-0.02);

}
function setupSkill(){
  const D=DEMOS[SK.id];
  for(const id in POS){POS[id].o=0;POS[id].z=0;delete POS[id].act;delete POS[id].J;}
  FOOT.length=0;D.steps.forEach(s=>FOOT.push({x:s.to[0],y:s.to[1],f:s.f,n:s.n,t1:s.t1,on:false}));

    t.textContent=f.n+(f.f==='L'?'左':'右');});

    for(let i=0;i<=24;i++){const u=i/24;pts.push({x:s.a[0]+(s.b[0]-s.a[0])*u,y:s.a[1]+(s.b[1]-s.a[1])*u,h:s.a[2]+(s.b[2]-s.a[2])*u+Math.sin(Math.PI*u)*s.arc});}
    TRAILS.push(pts);
    el('line',{x1:s.a[0],y1:s.a[1],x2:s.b[0],y2:s.b[1],stroke:'#fff','stroke-width':0.05,'stroke-dasharray':'0.18 0.14',opacity:0.6},gTrail);});
  // 時間軸刻度
  $('skTicks').innerHTML=D.ticks.map(([t,l])=>`<span style="left:${t/D.dur*100}%"><i></i>${l}</span>`).join('');
  $('infoTitle').textContent=D.name;$('infoEn').textContent=D.en;$('infoDesc').textContent=D.desc;$('infoKey').innerHTML=D.key;
  $('stat').textContent='地板上的腳印：藍色＝左腳、橘色＝右腳，數字是步數。可以拖曳時間軸停在任何一個瞬間。';
  SK.t=0;SK.playing=false;SK.phase=-1;highlight([]);
  if(view!=='3d')document.querySelector('#viewTabs button[data-view="3d"]').click();

function skillTick(now){
  const dt=Math.min(0.05,(now-(SK.last||now))/1000);SK.last=now;

const ADV={pass:'A',mb:'center',weak:'none',habit:'read',clutch:'no'};
const ADV_Q=[
  {k:'pass',t:'一傳品質',o:[['A','到位'],['B','偏離'],['C','不到位']]},

// 每個戰術攻擊的是哪一側（我方視角）
const SIDE={high4:'left',go4:'left',aquick:'middle',timediff:'middle',pipe:'middle',cquick:'right',right:'right'};
function adviceRank(lu){
  return PLAYS.map(p0=>{
    const p=playText(p0,lu),side=SIDE[p.id],q=p.id==='aquick'||p.id==='cquick',pins=p.id==='go4'||p.id==='high4'||p.id==='right';
    let sc={high4:45,go4:60,aquick:55,cquick:45,right:lu.oppFront?52:42,pipe:45,timediff:40}[p.id];
    const pros=[],cons=[];const add=(v,txt)=>{sc+=v;if(txt)(v>0?pros:cons).push(txt);};
    // 一傳品質
    if(ADV.pass==='A'){if(q||p.id==='timediff')add(10,'一傳到位，快攻節奏最好配合');}
    else if(ADV.pass==='B'){
      if(q||p.id==='timediff')add(-35,'一傳偏離，快攻和時間差很難配合');
      if(p.id==='pipe')add(-10,'一傳偏離，後排攻擊時機不好抓');
      if(p.id==='high4')add(12,'一傳偏離時，高球讓主攻有時間調整');
    }else{
      if(p.id==='high4')add(35,'一傳不到位，高球是最穩的選擇');
      else if(p.id==='right')add(lu.oppFront?5:-30,lu.oppFront?'可以改舉二號位高球':'一傳不到位，很難舉後排 D 球');
      else if(p.id==='go4')add(-25,'一傳不到位，平快很難舉準');
      else if(p.id==='pipe')add(-30,'一傳不到位，後排攻擊風險高');
      else add(-60,'一傳不到位，幾乎不可能打快攻');
    }
    // 對方攔中位置
    if(ADV.mb==='center'){
      if(pins&&p.id!=='high4')add(10,'對方攔中守中間，快速拉開打邊線');
      if(q)add(-10,'對方攔中就在中間等你的快攻');
      if(p.id==='pipe')add(5,'');
    }else{
      const away=ADV.mb==='left'?'right':'left';
      if(side===ADV.mb)add(-20,`對方攔中靠向${ADV.mb==='left'?'左':'右'}側，這邊會遇到雙人攔網`);
      if(side===away)add(25,`對方攔中偏${ADV.mb==='left'?'左':'右'}，${away==='left'?'左':'右'}側只剩單人攔網`);

    // 攔網習慣
    if(ADV.habit==='commit'){
      if(p.id==='timediff')add(30,'對方跟快攻起跳，時間差正好打在攔網落地的時候');
      if(p.id==='pipe')add(20,'對方攔中跟跳快攻後，中間後方會空出來');

      if(q)add(10,'看球再跳的攔網最怕速度，快攻讓他來不及');
      if(p.id==='go4')add(5,'');
      if(p.id==='timediff')add(-10,'對方不會被誘餌騙，時間差效果不大');
      if(p.id==='high4')add(-8,'高球讓看球攔網有充足時間組成雙人攔網');

    // 關鍵分
    if(ADV.clutch==='yes'){
      if(p.id==='high4'||p.id==='go4')add(8,'關鍵分交給主攻，最穩定');

    return {p,score:Math.max(0,Math.min(100,Math.round(sc))),pros,cons,atk:attackerOf(p,lu)};
  }).sort((a,b)=>b.score-a.score);
}

function playRec(r){if(busy)return;playId=r.p.id;mode='offense';setupMode(false);runServeReceive(true);}

/* ========== 介面 ========== */
for(let r=1;r<=6;r++){const b=document.createElement('button');b.textContent='R'+r;b.dataset.r=r;b.title=`第 ${r} 輪`;$('rotBtns').appendChild(b);
  b.onclick=()=>{if(busy)return;rot=r;setupMode();};}
$('btnRotate').onclick=()=>{if(busy)return;rot=rot%6+1;setupMode();};
document.querySelectorAll('#modeTabs button').forEach(b=>b.onclick=()=>{if(busy)return;mode=b.dataset.mode;setupMode();});
$('btnPlay').onclick=()=>{if(busy)return;if(mode==='skill')skillToggle();else if(mode==='advice')playRec(adviceRank(lineup(rot))[0]);else if(mode==='defense')runDefense();else runServeReceive(mode==='offense');};
$('btnReset').onclick=()=>setupMode(false);
$('speed').onchange=e=>speed=parseFloat(e.target.value);
$('chkZones').onchange=e=>gZones.style.display=e.target.checked?'':'none';

function updateUI(){
  const lu=lineup(rot);
  document.querySelectorAll('#modeTabs button').forEach(b=>{b.classList.toggle('on',b.dataset.mode===mode);b.disabled=busy;});
  document.querySelectorAll('#rotBtns button').forEach(b=>{b.classList.toggle('on',+b.dataset.r===rot);b.disabled=busy;});
  $('btnRotate').disabled=busy;$('btnPlay').disabled=busy;

  // 站位表
  const who={};for(const id in lu.z)who[lu.z[id]]=id;
  const cell=z=>{const id=who[z]===lu.backMB?'L':who[z];return `<div><span class="z">${z} 號位</span><b style="color:${ROLE[id].color}">${ROLE[id].short}</b>${ROLE[id].name}</div>`;};
  $('lineup').innerHTML='<div class="netbar"></div>'+[4,3,2,5,6,1].map(cell).join('');
  $('liberoNote').textContent=`${lu.backMB} 在後排時由自由球員 L 替換上場。前排攻擊手：${lu.sFront?'2 人（舉球員在前排）':'3 人'}`;

  // 戰術按鈕
  const box=$('playBtns');box.innerHTML='';
  $('adviceSec').style.display=mode==='advice'?'':'none';
  $('skillSec').style.display=mode==='skill'?'':'none';$('skillBar').style.display=mode==='skill'?'':'none';
  document.querySelector('#camBtns button[data-cam=close]').style.display=mode==='skill'?'':'none';
  if(mode==='skill'){$('playSec').style.display='none';
    $('skillBtns').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.sk===SK.id));return;}
  if(mode==='advice'){$('playSec').style.display='none';$('adviceForm').querySelectorAll('button').forEach(b=>b.disabled=busy);return;}
  if(mode==='receive'){
    $('playSec').style.display='none';
    $('infoTitle').textContent=`第 ${rot} 輪 接發球站位`;
    $('infoEn').textContent='Serve Receive Formation · 5-1 System';
    $('infoDesc').textContent=`本輪舉球員在 ${lu.z.S} 號位（${lu.sFront?'前排':'後排'}）。接發球由兩位主攻（${lu.frontOH}、${lu.backOH}）和自由球員組成三人接發，其他球員靠網或站在後方，不參與接發。`;
    $('infoKey').innerHTML=`發球後，舉球員${lu.sFront?'沿著網':'從後排「插上」'}到二、三號位之間舉球。<br>為什麼要「藏人」？規則規定發球瞬間不能有位置重疊犯規，所以球隊會用特殊站位，讓舉球員離舉球點越近越好。`;
    $('stat').textContent='有白色虛線圈的是負責接發球的三位球員。';
  }else if(mode==='offense'){
    $('playSec').style.display='';$('playTitle').textContent='選擇進攻戰術 OFFENSE';
    PLAYS.forEach(p0=>{const p=playText(p0,lu);const b=document.createElement('button');
      b.innerHTML=`${p.name}<small>${p.en}</small>`;b.classList.toggle('on',p.id===playId);b.disabled=busy;
      b.onclick=()=>{playId=p.id;setupMode(false);};box.appendChild(b);});
    const p=playText(PLAYS.find(x=>x.id===playId),lu);
    $('infoTitle').textContent=p.name;$('infoEn').textContent=p.en;$('infoDesc').textContent=p.desc;$('infoKey').innerHTML=p.key;
    $('stat').textContent=`本輪攻擊手：${ROLE[attackerOf(p,lu)].name}（${attackerOf(p,lu)}）　｜　前排攻擊點 ${lu.sFront?2:3} 個 + 後排攻擊點 ${lu.sFront?2:1} 個`;
  }else{
    $('playSec').style.display='';$('playTitle').textContent='對方從哪裡進攻？ DEFENSE';
    DEF.forEach(d=>{const b=document.createElement('button');b.innerHTML=`${d.name}<small>${d.en}</small>`;
      b.classList.toggle('on',d.id===defId);b.disabled=busy;b.onclick=()=>{defId=d.id;setupMode(false);};box.appendChild(b);});
    const d=DEF.find(x=>x.id===defId),R=defRoles(lu);
    $('infoTitle').textContent='防守：'+d.name;$('infoEn').textContent=d.en+' · Perimeter Defense';$('infoDesc').textContent=d.desc;$('infoKey').innerHTML=d.key;
    $('stat').textContent=`攔網：${d.blockers.map(k=>ROLE[R[k]].name).join(' + ')}　｜　防守換位後：舉球員${lu.sFront?'在前排右側':'在後排 1 號位'}、自由球員在 5 號位`;
  }
}

document.querySelectorAll('#skillBtns button').forEach(b=>b.onclick=()=>{SK.id=b.dataset.sk;mode='skill';setupMode(false);});
$('skPlay').onclick=skillToggle;
$('skSlider').oninput=e=>{SK.playing=false;SK.t=e.target.value/1000*DEMOS[SK.id].dur;applySkill(SK.t);};
$('skSpeed').onchange=e=>SK.speed=parseFloat(e.target.value);
buildAdvicePanel();
setupMode(false);
</script>
</body>
</html>
